[project]
name = "revlens-analytics"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pandas>=2.2,<3",
  "numpy>=2,<3", "statsmodels>=0.14.5,<0.16", "psycopg[binary]>=3.2,<4",
  "dbt-postgres>=1.9,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
benchmark = ["openpyxl>=3.1,<4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["analytics/tests"]
pythonpath = ["."]
