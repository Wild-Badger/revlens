name: Verify and deploy portfolio demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:55432/unused
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec prisma generate
      - run: pnpm exec tsc --noEmit
      - run: pnpm test --maxWorkers=2
      - run: pnpm lint
      - run: pnpm demo:build
      - name: Publish compiled static branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm --cached -r .
          cp -r dist-demo/* .
          touch .nojekyll
          git add --force index.html assets .nojekyll
          git commit -m "build: publish demo from $GITHUB_SHA"
          git push --force origin gh-pages
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
